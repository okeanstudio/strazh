name: strazh
description: "A cross-platform messenger."
publish_to: 'none'
version: 1.1.4+25

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_localizations:
    sdk: flutter

  # Иконки
  cupertino_icons: ^1.0.9
  flutter_lucide: ^1.11.0
  flutter_dynamic_icon_plus: ^1.4.1

  # Путь к файлам
  path_provider: ^2.1.6

  #Перевод
  easy_localization: ^3.0.8

  # Разрешения
  #permission_handler: ^12.0.3

  # База данных Supabase
  supabase_flutter: ^2.16.0

  # Мощный медиа-движок
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Библиотеки для Windows
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_windows_video: ^1.0.11

  # Аудиопроигрыватели
  audioplayers: ^6.8.1

  # Запись голоса
  record: ^7.1.1

  # Аудио- и видеозвонки
  flutter_webrtc: ^0.12.12

  # Выбор фото и файлов
  image_picker: ^1.2.3
  file_selector: ^1.1.0

  # Универсальность
  universal_io: ^2.2.2

  # Открытие ссылок
  url_launcher: ^6.3.2

  #Открытие файлов
  open_file: ^4.0.0
  flutter_pdfview: ^1.4.5

  # Эмодзи-пикер
  emoji_picker_flutter: ^4.4.0

  # Безопасное хранение
  flutter_secure_storage: ^10.3.1

  # HTTP-запросы
  http: ^1.6.0
  web: ^1.1.1

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  firebase_messaging: ^16.6.0

  # Уведомления
  flutter_desktop_notifications: ^1.1.2

  # Windows
  window_manager: ^0.5.2

  # Сохранение
  shared_preferences: ^2.5.5

  # Нейросети
  deepseek_api: ^0.1.2

  # Сокеты
  socket_io_client: ^3.1.6

  # Информация
  package_info_plus: ^10.2.1

  # Подключение
  connectivity_plus: ^7.3.1

  # Анимации
  lottie: ^3.6.1

  # OAuth / OIDC flow (внешний браузер)
  flutter_web_auth_2: ^5.1.0

  # Галлерея
  saver_gallery: ^5.1.0

  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  image_cropper: ^13.0.0
  flutter_communication_avatar: ^1.1.0
  ffmpeg_kit_flutter_new_min: ^3.6.7
  video_player: ^2.14.1
  camera: ^0.12.2
  cryptography: ^2.9.0
  photo_manager: ^3.12.0
  desktop_drop: ^0.8.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  dmg: ^0.1.10

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/locales/
    - assets/gifts/
    - assets/wallpaper/
    - assets/icon/icon1.png
    - assets/icon/icon2.png
    - assets/icon/sirnik.png
    - assets/icon/poop.png
    - assets/icon/icon.png
    - assets/icon/okean_id.jpg
    - assets/icon/bots/botfather_strazh.jpg
    - assets/sounds/send_message.mp3
    - assets/sounds/message_here.mp3
    - assets/certs/isrg-root-x2.der
  fonts:
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans.ttf

dependency_overrides:
  flutter_communication_avatar:
    path: packages/flutter_communication_avatar